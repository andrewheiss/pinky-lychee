project:
  type: default
  output-dir: _output
  preview: 
    port: 4444

  render: 
    - "index.qmd"
    - "slides.qmd"

language: 
  title-block-published: Latest version
  related-formats-title: Other formats
  other-links-title: Other links

format:
  wordcount-html: 
    wordcount-banner: false

    toc: true
    shift-heading-level-by: 1
    theme: 
      - zephyr
      - brand
    # MoMAColors::moma.colors("ustwo")[2]
    title-block-banner: "#f06a63"

    template-partials: 
      - "html/title-metadata.html"

    include-after-body: 
      - text: |
          <script>
          document.querySelectorAll('.quarto-alternate-formats a').forEach(a => {
            a.childNodes.forEach(node => {
              if (node.nodeType === Node.TEXT_NODE) {
                node.textContent = node.textContent.replace(/\s*\(.*?\)\s*$/, '');
              }
            });
          });
          </script>

    format-links:
      - html
      - format: hikmah-typst
        text: PDF version
        icon: file-pdf
      # - format: hikmah-manuscript-typst+md
      #   text: Manuscripty PDF version
      #   icon: file-pdf
      # - format: docx
      #   text: Word version
      #   icon: file-word

    other-links:
      - text: Slides
        href: slides.html
        icon: easel3
      - text: GitHub repository
        href: https://github.com/andrewheiss/pinky-lychee/
        icon: github
      # - text: SocArXiv preprint
      #   href: https://doi.org/10.31235/osf.io/wvecz_v3
      #   icon: link-45deg

    knitr:
      opts_chunk:
        dev: "ragg_png"
        dpi: 300
  
  hikmah-typst: 
    output-file: heiss_ai-for-me-not-yet-for-thee.pdf
    pdf-standard: ua-1

    mainfont: Linux Libertine O
    linkcolor: "#d7433b"
    title-size: 1.55em
  
  # hikmah-manuscript-typst+md: 
  #   output-file: heiss_ai-for-me-not-yet-for-thee_ms.pdf
  #   pdf-standard: ua-1

  #   mainfont: Linux Libertine O
  #   linkcolor: "#d7433b"
  
  # Manuscript-y Word
  docx:
    output-file: heiss_ai-for-me-not-yet-for-thee.docx
    reference-doc: pandoc/reference-styles.docx

    knitr:
      opts_chunk:
        dev: "ragg_png"
        dpi: 300
